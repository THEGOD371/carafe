name: Carafe
options:
  bundleIdPrefix: dev.carafe
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  # Sparkle 2 — auto-update framework. SPM dependency; the framework
  # + its XPC services are embedded into Contents/Frameworks/ on
  # build. Works with hardened runtime + non-sandboxed apps with no
  # additional entitlements beyond what Carafe already has for Wine.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_HARDENED_RUNTIME: YES
    # Codesigning: leave team blank — user fills in via Xcode > Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Carafe:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Carafe
        excludes:
          - "**/*.entitlements"
          # Info.plist lives at App/Info.plist and is xcodegen-managed
          # via the `info:` block below. Excluding it from `sources:`
          # stops Xcode from also copying it as a bundle resource.
          - "App/Info.plist"
    # Hand-rolled Info.plist instead of GENERATE_INFOPLIST_FILE=YES.
    # We need an explicit `CFBundleIconFile` entry — that key is NOT
    # in Xcode's `INFOPLIST_KEY_*` auto-inject allowlist, so the
    # only reliable way to set it is to author the plist ourselves.
    # The plist is regenerated by xcodegen from this block on every
    # `xcodegen generate`; do not hand-edit `Carafe/App/Info.plist`.
    info:
      path: Carafe/App/Info.plist
      properties:
        CFBundleDisplayName: Carafe
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The actual icon binding. Points at AppIcon.icns in the
        # bundle's Resources/. See Tools/generate-app-icon.swift for
        # why we use a bare icns instead of an asset-catalog
        # AppIcon.appiconset.
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.games
        LSMinimumSystemVersion: "14.0"
        NSAccentColorName: AccentColor
        NSAppleEventsUsageDescription: "Carafe runs privileged installers (Rosetta, Xcode Command Line Tools) using the standard macOS authorization dialog."
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Carafe contributors. MIT licensed."
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        # --- Sparkle (auto-update) ---
        # Appcast URL. Placeholder repo path — replace
        # `THEGOD371/carafe` with the real GitHub repo slug before
        # the first tagged release. GitHub Releases serves arbitrary
        # files attached to the "latest" release at this stable URL.
        SUFeedURL: https://github.com/THEGOD371/carafe/releases/latest/download/appcast.xml
        # Enable scheduled background update checks.
        SUEnableAutomaticChecks: true
        # 86400 s = once per 24 hours. The user's "skip this version"
        # choice is honoured by Sparkle's UpdateAlert UI automatically;
        # no extra plumbing needed here.
        SUScheduledCheckInterval: 86400
        # Notify the user about updates; do NOT auto-install. We want
        # the user to opt in to each update so botched releases don't
        # silently brick people's bottles.
        SUAutomaticallyUpdate: false
        # SUPublicEDKey is INTENTIONALLY ABSENT until the release-
        # engineering work in milestone B-2/B-3 generates the EdDSA
        # key pair (`generate_keys` from the Sparkle distribution).
        # Without it, Sparkle will let the user trigger a check but
        # the actual install fails at signature validation — which is
        # the correct behaviour pre-release. See TESTING.md →
        # "Sparkle release engineering" for the one-time setup.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.carafe.Carafe
        PRODUCT_NAME: Carafe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: Carafe/App/Carafe.entitlements
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # AccentColor is wired through the asset catalog
        # (`AccentColor.colorset` inside `Assets.xcassets`).
        # GLOBAL_ACCENT_COLOR_NAME does NOT auto-default on macOS,
        # so without this line the colorset is ignored and `.tint`
        # falls back to the user's system accent. We deliberately do
        # NOT set ASSETCATALOG_COMPILER_APPICON_NAME — the app icon
        # comes from the bare AppIcon.icns via CFBundleIconFile,
        # not from the catalog.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
